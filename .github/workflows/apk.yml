name: Armar APK

# Se ejecuta al publicar una versión (etiqueta v1.2.0, v1.3.0, …)
# o a mano desde la pestaña Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar herramientas
        run: |
          mkdir -p tools
          curl -sSL -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -sSL -o tools/signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Preparar la llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > root.keystore

      - name: Armar y firmar
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: bash scripts/build_apk.sh

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: ROOT-apk
          path: dist/*.apk

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "ROOT $GITHUB_REF_NAME" \
            --notes "Descarga el APK de abajo e instálalo en tu Android. Si ya tienes ROOT instalado, se actualiza encima sin perder nada."
